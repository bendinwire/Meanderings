<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meanderings</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Meanderings">
<meta property="og:description" content="A daily word chain. Guess each word; the next one shares letters with it.">
<meta property="og:image" content="https://flexgames.com/meanderings/assets/meanderings-icon.png">
<meta name="twitter:card" content="summary">
<style>
  :root {
    --bg: #faf7f2; --fg: #222; --box: #fff; --line: #cfc8bb; --muted: #7a7468;
    --accent: #c8553d; --link: #e8b93c; --good: #4c9a5f; --key: #e4ded2; --auto: #d9822b;
    --cell: 44px; --gap: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16171a; --fg: #eee; --box: #23252a; --line: #3b3e45; --muted: #9a9a9a; --key: #2f3239; }
  }
  * { box-sizing: border-box; }
  /* Locked down: no sideways scrolling, no pinch/double-tap zoom (rapid taps on the on-screen keyboard used to zoom the page). */
  html, body { overflow-x: hidden; overscroll-behavior-x: none; touch-action: pan-y; -webkit-text-size-adjust: 100%; }
  button, .tile { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .testbar { background: #d64541; color: #fff; text-align: center; font-size: 12px; padding: 6px 12px; }
  header { text-align: center; padding: 14px 16px 4px; }
  .logo { display: block; width: 56px; height: 56px; margin: 0 auto 6px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: .08em; text-transform: uppercase; }
  .sub { margin: 4px auto 0; color: var(--muted); font-size: 13px; max-width: 460px; }
  .bar { display: flex; justify-content: center; gap: 14px; align-items: center;
    margin: 10px 0 14px; font-size: 13px; color: var(--muted); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .btn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; }
  main { padding: 0 16px 280px; overflow-x: hidden; touch-action: pan-y; }   /* the game scrolls it itself to center the active row */
  #board { margin: 0 auto; position: relative; }
  #meander { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; overflow: visible; }
  #meander path { fill: none; stroke: var(--line); stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
  #meander path.flow { stroke: var(--link); opacity: 1; filter: drop-shadow(0 0 6px var(--link));
    animation: flow 2.4s ease-in-out both; }
  #meander path.stream { stroke: var(--link); opacity: .9; }
  #meander path.done { stroke: var(--link); opacity: .85; filter: drop-shadow(0 0 4px var(--link)); }
  @keyframes flow { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  .entry { margin-bottom: 14px; position: relative; z-index: 1; }
  /* Text under a row is pinned to the screen width, so it stays readable when a wide board is panned. */
  .clue, .hintwrap, .strip, .blindtag { position: sticky; left: 16px; width: calc(100vw - 32px); max-width: 100%; }
  .clue span { background: var(--bg); padding: 0 8px; position: relative; }
  .clue.pending { opacity: .6; }
  .tiles { display: flex; gap: var(--gap); width: max-content; }
  .tile { width: var(--cell); height: var(--cell); display: grid; place-items: center;
    border: 2px solid var(--line); background: var(--box); border-radius: 6px;
    font-weight: 700; font-size: calc(var(--cell) * .5); text-transform: uppercase; }
  .tile.cursor { border-color: var(--accent); }
  .tile.solved { background: var(--good); border-color: var(--good); color: #fff; } /* .tile.link (below) keeps shared letters gold */
  .tile.link { background: var(--link); border-color: var(--link); color: #222; }
  .tile.good { background: var(--good); border-color: var(--good); color: #fff; }
  .clue { text-align: center; color: var(--muted); font-style: italic; font-size: 14px; margin-top: 5px; }
  .tile.tap { cursor: pointer; }
  .tile.pick { outline: 3px dashed var(--accent); outline-offset: 2px; }
  .hinttip { margin-top: 4px; font-size: 12px; color: var(--muted); }
  .plainclue { text-align: center; font-size: 13px; color: var(--muted); margin-top: 4px; position: sticky; left: 16px; width: calc(100vw - 32px); max-width: 100%; }
  .hintwrap { text-align: left; margin-top: 8px; }   /* far from the ENTER key on the right */
  .hintwrap .btn { padding: 5px 16px; font-size: 14px; }
  /* free-solve (theme) mode: every row open, clue above its tiles */
  .themed .entry { margin-bottom: 9px; }
  .themed .clue { margin: 0 0 3px; font-size: 13px; }
  .themed .entry.active .clue { font-size: 15px; }
  .themed .entry.open:not(.active) .tiles { opacity: .78; }
  .themed .entry.open:not(.active) .clue, .themed .entry.open:not(.active) .tile { cursor: pointer; }
  .themed .entry.solvedrow .clue { opacity: .55; }
  .kbd { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 8px; color: var(--muted); }
  @media (hover: none) { .kbd { display: none; } }
  .entry.active .clue { color: var(--fg); font-size: 16px; }
  .nav { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #puzzle { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; min-width: 120px; }
  .btn:disabled { opacity: .35; cursor: default; }
  .tabs { display: inline-flex; margin: 8px 0 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg { background: none; border: 0; padding: 6px 16px; font-size: 14px; border-right: 1px solid var(--line); }
  .seg:last-child { border-right: 0; }
  .seg.on { background: var(--fg); color: var(--bg); font-weight: 700; }
  .tile.hint { background: #d64541; border-color: #d64541; color: #fff; }
  .tile.given { background: #5aa9e6; border-color: #5aa9e6; color: #10202e; }
  .tile.auto { background: var(--auto); border-color: var(--auto); color: #fff; }
  #timer { text-align: center; font-size: 12px; color: var(--auto); min-height: 16px; margin: -8px 0 6px; }
  #settings { max-width: 380px; margin: 0 auto 12px; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; }
  #settings[hidden] { display: none; }
  #settings p { margin: 6px 0 0; color: var(--muted); }
  #settings select { font-size: 16px; font: inherit; font-size: 16px; color: inherit; background: var(--box); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
  .sgrid { display: inline-flex; flex-direction: column; gap: 3px; margin: 12px 0 6px; text-align: left; }
  .srow { display: flex; gap: 3px; align-items: center; }
  .sb { width: var(--sb, 18px); height: var(--sb, 18px); border-radius: 3px; display: block; }
  .sb.g { background: var(--good); } .sb.y { background: var(--link); }
  .sb.b { background: #5aa9e6; }
  .sb.r { background: #d64541; }     .sb.o { background: var(--auto); }
  .sb.k { background: var(--line); opacity: .3; }
  .sx { margin-left: 6px; font-size: 13px; line-height: 1; }
  .legend { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .summary .big { font-size: 34px; font-weight: 800; margin: 4px 0; }
  .shake .tile:not(.link):not(.good):not(.auto):not(.hint):not(.given) { animation: shake .35s; }
  /* the letter dance: a staggered wave of hops, tiles flipping green */
  .dance .tile:not(.link):not(.hint):not(.auto):not(.given) { background: var(--good); border-color: var(--good); color: #fff; }
  .dance .tile { animation: hop .65s ease-in-out both; animation-delay: calc(var(--r, 0) * 200ms + var(--i) * 70ms); }
  @keyframes hop {
    0%   { transform: translateY(0) rotate(0); }
    25%  { transform: translateY(-16px) rotate(-8deg) scale(1.12); }
    50%  { transform: translateY(0) rotate(5deg); }
    70%  { transform: translateY(-6px) rotate(-3deg); }
    100% { transform: translateY(0) rotate(0); }
  }
  @media (prefers-reduced-motion: reduce) { .dance .tile { animation: none; } }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .strip { display: flex; gap: var(--gap); justify-content: center; margin-top: 10px; min-height: var(--cell); flex-wrap: wrap; }
  .tile.empty { border-style: dashed; opacity: .55; }
  .blindtag { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
  .combo { color: var(--link); font-weight: 700; }
  #bonus { max-width: 420px; margin: 0 auto 12px; padding: 10px 14px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 13px; }
  #bonus[hidden] { display: none; }
  .bonus-title { color: var(--muted); }
  #bonusClue { margin: 6px 0; font-size: 15px; font-style: italic; }
  #bonusLetters { display: flex; gap: 4px; justify-content: center; margin: 8px 0; }
  .rtile { width: 34px; height: 34px; font-size: 17px; cursor: pointer; }
  #bonus.focus { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  #bonusRow { text-align: center; }
  #bonusRow .btn { padding: 5px 18px; }
  #bonusNote { margin-top: 6px; color: var(--muted); min-height: 16px; }
  .chk { display: block; margin-top: 6px; }
  dialog { background: var(--bg); color: var(--fg); border: 2px solid var(--line); border-radius: 12px;
    max-width: min(440px, calc(100vw - 32px)); padding: 16px 20px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h2 { margin: 0 0 8px; }
  dialog form { text-align: center; margin-top: 10px; }
  .stat-top { display: flex; gap: 12px; justify-content: center; margin-bottom: 12px; }
  .stat-top div { text-align: center; min-width: 80px; } .stat-top b { display: block; font-size: 28px; }
  .stat-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .stat-tbl th, .stat-tbl td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  .stat-tbl th:first-child, .stat-tbl td:first-child { text-align: left; }
  .summary { position: sticky; left: 16px; width: calc(100vw - 32px); max-width: 100%; text-align: center; padding: 18px; border: 2px solid var(--line); border-radius: 10px; margin-top: 8px; }
  .summary h2 { margin: 0 0 6px; }
  .summary .btn { margin: 8px 4px 0; padding: 6px 14px; }
  footer { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--bg);
    border-top: 1px solid var(--line); padding: 6px 6px calc(8px + env(safe-area-inset-bottom)); }
  .finished #kb { display: none; }
  .finished footer { border-top: 0; background: transparent; pointer-events: none; }
  .finished main { padding-bottom: 60px; }
  #msg { position: absolute; left: 50%; bottom: 100%; margin-bottom: 12px; transform: translateX(-50%); z-index: 10; /* just above the keyboard, clear of the row being solved */
    max-width: calc(100vw - 32px); text-align: center; font-size: 20px; font-weight: 700;
    padding: 14px 26px; border-radius: 14px; background: var(--fg); color: var(--bg);
    box-shadow: 0 8px 30px rgba(0,0,0,.35); pointer-events: none; animation: toast .18s ease-out; }
  #msg:empty { display: none; }
  @keyframes toast { from { opacity: 0; transform: translateX(-50%) scale(.9); } }
  #kb { max-width: 520px; margin: 0 auto; }
  .krow { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
  .key { flex: 1; max-width: 44px; height: 46px; border: 0; border-radius: 6px; background: var(--key);
    font-weight: 600; font-size: 15px; padding: 0; }
  .key.wide { flex: 2.6; max-width: 112px; font-size: 13px; }
  .key.enter { background: var(--good); color: #fff; font-weight: 700; letter-spacing: .04em; }
  .key:active { filter: brightness(.9); }
</style>
</head>
<body>
<header>
  <img class="logo" src="assets/icon-header.png" alt="" width="56" height="56">
  <h1>Meanderings</h1>
  <p class="sub">Guess each word from its clue. The next word shares letters with the one above — they're filled in and lined up for you.</p>
  <div class="tabs">
    <button class="seg" data-d="easy">Easy</button>
    <button class="seg" data-d="medium">Medium</button>
    <button class="seg" data-d="hard">Hard</button>
  </div>
  <div class="nav">
    <button class="btn" id="prevBtn" aria-label="Previous puzzle" title="Previous puzzle">‹</button>
    <span id="puzzle"></span>
    <button class="btn" id="nextBtn" aria-label="Next puzzle" title="Next puzzle">›</button>
    <button class="btn" id="todayBtn">Today</button>
    <button class="btn" id="randomBtn" aria-label="Random chain" title="A random chain">🎲</button>
  </div>
  <div class="bar">
    <span id="progress"></span>
    <span id="stats"></span>
    <button class="btn" id="bonusBtn" aria-label="Bonus puzzle" title="Bonus puzzle">🎁</button>
    <button class="btn" id="statsBtn" aria-label="Stats" title="Stats">📊</button>
    <button class="btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
  </div>
  <div id="timer"></div>
  <div id="bonus" hidden>
    <div class="bonus-title">🎁 Bonus: the <b>first gold letter</b> of each row, top to bottom, spells a word</div>
    <div id="bonusClue"></div>
    <div id="bonusLetters"></div>
    <div id="bonusRow"><button class="btn" id="bonusGuess">Guess</button></div>
    <div id="bonusNote"></div>
  </div>
  <div id="settings" hidden>
    <label>Auto-reveal a letter every
      <select id="autoSecs">
        <option value="0">Off</option>
        <option value="15">15 seconds</option>
        <option value="30">30 seconds</option>
        <option value="45">45 seconds</option>
        <option value="60">60 seconds</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="soundOn"> Sound</label>
    <label class="chk"><input type="checkbox" id="hapticsOn"> Haptics</label>
    <p id="scoreNote"></p>
  </div>
</header>
<main><div id="board"></div></main>
<dialog id="statsDlg">
  <h2>Stats</h2>
  <div id="statsBody"></div>
  <form method="dialog"><button class="btn">Close</button></form>
</dialog>
<footer>
  <div id="msg"></div>
  <div id="kb"></div>
</footer>
<script src="words.js"></script>
<script src="fx.js"></script>
<script src="game.js"></script>
</body>
</html>
